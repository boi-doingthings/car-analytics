name: Baseline checks
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: analytics/package-lock.json
      - run: npm ci
        working-directory: analytics
      - run: npm test
        working-directory: analytics
      - run: python3 tools/check_publication.py
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q
  swift-core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path ios/I20Core

  ios-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: analytics/package-lock.json
      - run: npm ci && npm run build
        working-directory: analytics
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - name: Select an available iPhone simulator
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))['devices']
          phone = next(device for runtime, group in devices.items() if 'iOS' in runtime for device in group if device['name'].startswith('iPhone'))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('TEST_DESTINATION=platform=iOS Simulator,id=' + phone['udid'] + '\n')
          PYTHON
      - name: Native app unit and navigation tests
        run: xcodebuild -project ios/I20Logbook.xcodeproj -scheme I20Logbook -destination "$TEST_DESTINATION" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test
